<!doctype html>
<html lang="pt-BR">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<title>mcurso</title>

		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		%sveltekit.head%
	</head>
	<body data-theme="brutalist" data-sveltekit-preload-data="hover">
		<script>
			// Aplica o tema salvo antes da primeira pintura: sem JS do app não há flash.
			try {
				const permitidos =
					'light dark cupcake retro cyberpunk synthwave aqua valentine brutalist brutalist-dark'.split(
						' '
					);
				const salvo = localStorage.getItem('ahmar-theme');
				if (salvo && permitidos.includes(salvo)) document.body.setAttribute('data-theme', salvo);
			} catch {}
		</script>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
