# Scripts de build por pacote. `allowBuilds` é o formato da pnpm ≥10.26/v11+: a
# v11 tornou o `strictDepBuilds` padrão (`true`) e removeu `onlyBuiltDependencies`/
# `ignoredBuiltDependencies`, então sem `allowBuilds` o install do deploy morre com
# ERR_PNPM_IGNORED_BUILDS. As chaves antigas ficam para a pnpm <10.26 (a local,
# 10.12.4, que ainda não conhece `allowBuilds`). better-sqlite3 está em 12.x de
# propósito (a 13.x exige GLIBC_2.29 e quebra no build da Hostinger) e o install
# script dele PRECISA rodar: a 12.x não traz prebuild no tarball — quem baixa o
# binário é o `prebuild-install` (com fallback de compilação) — ver AGENTS.md.
onlyBuiltDependencies:
  - esbuild
  - better-sqlite3
allowBuilds:
  esbuild: true
  better-sqlite3: true